<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Loboczss">
  <!-- Portal ground: keeps the mark legible on any browser-tab colour. -->
  <circle cx="32" cy="32" r="32" fill="#0B0620"/>

  <!-- Silhouette only. At 16px the internal mesh is noise, so the favicon
       ships the form that survives and nothing else. -->
  <path d="M15 13 L20.5 26 L26 22.5 L32 24.5 L38 22.5 L43.5 26 L49 13 L50.5 30 L45.5 38 L38 45 L32 49 L26 45 L18.5 38 L13.5 30 Z"
        fill="none" stroke="#8E86B7" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Eyes as angular slits, not discs. -->
  <g stroke="#FF6A88" stroke-width="3" stroke-linecap="butt">
    <line x1="23.8" y1="30.6" x2="27.6" y2="33"/>
    <line x1="40.2" y1="30.6" x2="36.4" y2="33"/>
  </g>
</svg>
